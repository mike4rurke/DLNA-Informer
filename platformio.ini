; MultiInformer CYD — ESP32-2432S028R, дисплей ILI9341 320x240.
[platformio]
default_envs = cyd-ili9341

[env:cyd-ili9341]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@6.21.5
  links2004/WebSockets@2.6.1
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D LOAD_GLCD
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D LV_CONF_SKIP
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=0
  -D LV_MEM_SIZE=49152
  -D LV_FONT_MONTSERRAT_32=1
  -D LV_FONT_MONTSERRAT_48=1
